<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TGPlayer</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { padding: 8px; }
    .menu { width: 244px; padding: 9px; border: 1px solid rgba(155, 190, 222, .12); border-radius: 13px; background: linear-gradient(150deg, #182534, #111b27); box-shadow: 0 14px 32px rgba(0, 0, 0, .42), 0 2px 8px rgba(0, 0, 0, .28); }
    .status { min-height: 29px; padding: 4px 12px 8px; overflow: hidden; color: #9fb2c4; font-size: 11px; line-height: 1.35; white-space: nowrap; text-overflow: ellipsis; }
    .group { margin-top: 3px; padding-top: 7px; border-top: 1px solid rgba(180, 205, 226, .12); }
    button { width: 100%; min-height: 37px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #eef5fb; font: 500 13px "Segoe UI", "Microsoft YaHei", sans-serif; text-align: left; cursor: pointer; transition: background-color .14s ease, color .14s ease, transform .1s ease; }
    button:hover, button:focus-visible { outline: 0; background: rgba(132, 174, 211, .18); color: #fff; }
    button:active { background: rgba(132, 174, 211, .28); transform: scale(.985); }
    .danger { color: #f4b6b6; }
    .danger:hover, .danger:focus-visible { background: rgba(199, 88, 98, .2); color: #ffd9d9; }
  </style>
</head>
<body>
  <div class="menu" role="menu" aria-label="TGPlayer 托盘菜单">
    <div class="status" id="status">TGPlayer</div>
    <button type="button" data-command="show" role="menuitem">显示主窗口</button>
    <div class="group">
      <button type="button" id="toggle" data-command="toggle" role="menuitem">继续播放</button>
      <button type="button" data-command="next" role="menuitem">下一首</button>
      <button type="button" data-command="previous" role="menuitem">上一首</button>
    </div>
    <div class="group">
      <button type="button" class="danger" data-command="quit" role="menuitem">退出 TGPlayer</button>
    </div>
  </div>
  <script>
    const api = window.tgPlayer?.trayMenu;
    const status = document.getElementById('status');
    const toggle = document.getElementById('toggle');
    function applyState(next = {}) {
      const title = String(next.title || '').trim();
      status.textContent = title ? `${next.playing ? '正在播放' : '已暂停'}  ·  ${title}` : 'TGPlayer  ·  当前没有播放';
      toggle.textContent = next.playing ? '暂停播放' : '继续播放';
    }
    document.querySelectorAll('[data-command]').forEach(button => button.addEventListener('click', () => api?.command(button.dataset.command)));
    document.addEventListener('keydown', event => { if (event.key === 'Escape') api?.command('dismiss'); });
    api?.onState(applyState);
    api?.ready();
  </script>
</body>
</html>
